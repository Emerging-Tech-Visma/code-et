[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/interface",
    "apps/server",
    "apps/desktop",
    "apps/web",
    "apps/mobile",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/{{owner}}/{{name}}"

[workspace.dependencies]
# Layer crates (intentional: every app/crate references these by workspace path).
# `interface` ships with no default features — each app opts into its render target
# (server / desktop / web / mobile) explicitly.
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
interface = { path = "crates/interface", default-features = false }

# Shared third-party — pinned to minor; patches via cargo update
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
async-trait = "0.1"
anyhow = "1"
mockall = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals", "launch"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
