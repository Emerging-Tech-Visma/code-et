# cargo-audit configuration.
# Format: https://docs.rs/cargo-audit/latest/cargo_audit/config/struct.AuditConfig.html
#
# Each ignore must include a rationale comment. Re-evaluate every time we
# bump deps. Unmaintained / unsound warnings (gtk-rs 0.18 chain via
# dioxus-desktop, etc.) exit 0 by default and don't need ignores — they
# show up in the cargo-audit output as informational warnings.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa 0.9.x Marvin Attack (timing side-channel, no fixed upgrade).
    # Reason: pulled in transitively by sqlx-macros 0.8.x, which compiles all DB
    # backend support for compile-time `query!` checking. We use sqlite + postgres
    # only — the rsa crate is never reached at runtime. Re-check on every sqlx bump
    # and remove this ignore once sqlx-macros decouples mysql.
    "RUSTSEC-2023-0071",
]
