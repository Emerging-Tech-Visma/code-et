[package]
name = "interface"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
domain = { workspace = true }
application = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# UI
dioxus = { workspace = true }

# HTTP (axum) — gated to keep WASM builds light
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# cargo-machete misses feature-gated optional deps; tower/tower-http/tokio
# are wired into the `server` feature even when not directly imported by
# the current handler set. Remove ignores once a handler imports them.
[package.metadata.cargo-machete]
ignored = ["tokio", "tower", "tower-http"]

[features]
default = ["server"]
server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio", "dioxus/fullstack"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]
