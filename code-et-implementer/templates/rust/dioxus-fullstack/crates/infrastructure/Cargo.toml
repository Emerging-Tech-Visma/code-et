[package]
name = "infrastructure"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
domain = { workspace = true }
application = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
secrecy = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "postgres", "uuid"] }
# Add when first used:
#   thiserror — for explicit error enums in adapters (use case errors should be
#               thiserror-derived; adapter-internal can use anyhow).
#   serde_json — for HTTP client request/response bodies.
#   tokio = { workspace = true } — for async helpers beyond what sqlx exposes.
#   tracing — for adapter-level instrumentation.
#   reqwest — for HTTP-client adapters (http_clients/).

[dev-dependencies]
tokio = { workspace = true }
