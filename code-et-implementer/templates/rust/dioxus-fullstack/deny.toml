# cargo-deny config. See https://embarkstudios.github.io/cargo-deny/.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `unmaintained` defaults to "all" (error on any unmaintained crate) in
# cargo-deny v2. The dioxus-desktop stack drags in 10+ unmaintained
# gtk-rs 0.18 / fxhash crates that we cannot fix without dioxus migrating
# upstream. Set to "workspace" — only error if one of OUR workspace crates
# becomes unmaintained. cargo-audit (stage 5) still surfaces every transitive
# advisory in its report and CI logs.
unmaintained = "workspace"
# `unsound` — keep as error; if a real unsoundness lands, we want to fail.
# Each ignore below needs a one-line rationale. See audit.toml for long-form.
# Re-evaluate every time deps bump.
ignore = [
    # rsa Marvin Attack — transitive via sqlx-macros (compile-time only),
    # no mysql at runtime. Remove once sqlx-macros decouples mysql.
    "RUSTSEC-2023-0071",
    # glib 0.18 unsound — transitive via dioxus-desktop's gtk-rs 0.18 chain.
    # Removed once dioxus-desktop migrates off the unmaintained stack.
    "RUSTSEC-2024-0429",
    # rand 0.7 unsound (custom logger) — transitive via dioxus-desktop's
    # kuchikiki/selectors. Removed once dioxus-desktop deps modernise.
    "RUSTSEC-2026-0097",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # NCSA: University of Illinois / NCSA Open Source License. OSI-approved
    # permissive, equivalent in scope to MIT/BSD. Required by libfuzzer-sys
    # (transitive via dioxus-desktop → image → ravif → rav1e).
    "NCSA",
    # CDLA-Permissive-2.0: Community Data License Agreement Permissive 2.0.
    # Used by webpki-roots. Permissive, equivalent in scope to MIT/BSD.
    "CDLA-Permissive-2.0",
    # BSL-1.0: Boost Software License 1.0. OSI-approved, very permissive
    # (no attribution required for binary distributions). Used by xxhash-rust.
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Workspace path deps (`domain = { workspace = true }`) carry no version and
# read as wildcards to cargo-deny. `allow-wildcard-paths` only suppresses this
# for crates marked `publish = false`; we don't enforce that across every
# member, so we downgrade wildcards to warn — the workspace path deps are
# internal-only by construction. Use review to catch real `serde = "*"` slips.
wildcards = "warn"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
