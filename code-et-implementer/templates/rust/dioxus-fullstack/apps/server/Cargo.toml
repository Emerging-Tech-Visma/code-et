[package]
name = "server"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
infrastructure = { workspace = true }
interface = { workspace = true, features = ["server"] }
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "postgres"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
secrecy = { workspace = true }
# As the composition root grows to instantiate use cases directly, add:
#   domain = { workspace = true }
#   application = { workspace = true }
# These are removed for now to keep the audit gate clean — `interface::http::router`
# already wires the sample CreateUser path.
