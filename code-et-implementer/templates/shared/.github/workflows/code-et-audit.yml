name: code-et-audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_et_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v4

      - name: install GTK + WebKit + xdo system libs (dioxus-desktop)
        # dioxus-desktop on Linux uses wry → webkit2gtk → glib/gtk + xdo for
        # tray-icon. Without these, `cargo build` fails on apps/desktop. Skip
        # this step (and remove libxdo-dev) if your project's `--targets`
        # excludes desktop.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libglib2.0-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: layer-deps validator
        run: bash scripts/layer-deps-validator.sh

      - name: cargo-machete (unused deps)
        uses: bnjbvr/cargo-machete@main

      # cargo-audit ignores: each must have a rationale comment in audit.toml.
      # Re-evaluate every time deps bump.
      - name: cargo-audit (advisories)
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: cargo-deny (license + bans + sources + advisories)
        uses: EmbarkStudios/cargo-deny-action@v1

      - name: tests
        run: cargo nextest run --workspace --all-features
        env:
          DATABASE_URL: "sqlite::memory:"
